name: Validate Issue 20 laboratory depth and acceptance v32

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/v32/lab-methods-ar.json'
      - 'content/v32/monitor-items/**'
      - 'content/v32/official-scale-provenance-ar.json'
      - 'scripts/publish_monitor_items_v32.py'
      - 'scripts/harden_monitor_runtime_v32.py'
      - 'scripts/harden_cognitive_distinctness_v32.py'
      - 'scripts/enrich_lab_content_v32.py'
      - 'scripts/render_lab_specificity_v32.py'
      - 'scripts/apply_scale_provenance_v32.py'
      - 'scripts/harden_lab_runtime_v32.py'
      - 'scripts/e2e_lab_acceptance_v32.mjs'
      - 'tests/test_lab_issue20_v32.py'
      - '.github/workflows/validate-issue20-labs-v32.yml'
  push:
    branches: [main, agent/issue-20-labs-exhaustive-v32]
    paths:
      - 'content/v32/lab-methods-ar.json'
      - 'content/v32/monitor-items/**'
      - 'content/v32/official-scale-provenance-ar.json'
      - 'scripts/publish_monitor_items_v32.py'
      - 'scripts/harden_monitor_runtime_v32.py'
      - 'scripts/harden_cognitive_distinctness_v32.py'
      - 'scripts/enrich_lab_content_v32.py'
      - 'scripts/render_lab_specificity_v32.py'
      - 'scripts/apply_scale_provenance_v32.py'
      - 'scripts/harden_lab_runtime_v32.py'
      - 'scripts/e2e_lab_acceptance_v32.mjs'
      - 'tests/test_lab_issue20_v32.py'
      - '.github/workflows/validate-issue20-labs-v32.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue20-labs-v32-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SITE_BASE: https://healthrenewal.org/

jobs:
  laboratory-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore production generators and sources
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v10-content
          cp content/sectors-v10/*.json /tmp/v10-content/
          cat .v10bundle/part00 .v10bundle/part01 .v10bundle/part02 .v10bundle/part03 .v10bundle/part04 | base64 --decode > /tmp/v10.tar.gz
          tar -xzf /tmp/v10.tar.gz
          cp /tmp/v10-content/*.json content/sectors-v10/
          cat .generator-v6/part00 .generator-v6/part01 .generator-v6/part02 .generator-v6/part03 > build_site.py
          python scripts/verify_enricher_v7.py
          python scripts/verify_expander_v9.py

      - name: Compile Issue 20 publishers tests and browser audit
        run: |
          set -euxo pipefail
          python -m py_compile \
            scripts/publish_monitor_items_v32.py \
            scripts/harden_monitor_runtime_v32.py \
            scripts/harden_cognitive_distinctness_v32.py \
            scripts/enrich_lab_content_v32.py \
            scripts/render_lab_specificity_v32.py \
            scripts/apply_scale_provenance_v32.py \
            scripts/harden_lab_runtime_v32.py \
            tests/test_lab_issue20_v32.py
          node --check scripts/e2e_lab_acceptance_v32.mjs
          node --check scripts/e2e_all_labs_v22.mjs

      - name: Run focused unit and idempotence tests
        run: python -m unittest -v tests/test_lab_issue20_v32.py

      - name: Build the exact 40 assessment and 53 cognitive production surface
        run: |
          set -euxo pipefail
          python build_site.py
          python enrich_site_v7.py
          cp google644f1f7a8b7aaa2b.html _site/google644f1f7a8b7aaa2b.html
          python scripts/scale_site_v8.py
          python expand_site_v9.py
          python scripts/design_content_v10.py
          python scripts/apply_contrast_v11.py _site
          python scripts/expand_v12_direct.py _site
          python scripts/performance_hotfix_v14.py _site
          python scripts/optimize_site_performance_v14.py _site
          python scripts/strip_nonlab_runtime_v14.py _site
          python scripts/complete_core_sections_v15.py _site
          python scripts/upgrade_cognitive_batch1_v22.py _site
          python scripts/upgrade_cognitive_batch2_v22.py _site
          python scripts/fix_initial_cognitive_variation_v25.py _site
          python scripts/fix_stroop_and_variation_v23.py _site
          python scripts/complete_cognitive_remaining_v24.py _site
          python scripts/fix_cognitive_quality_v26.py _site
          python scripts/publish_monitor_items_v32.py _site
          python scripts/harden_lab_runtime_v32.py _site
          python scripts/harden_monitor_runtime_v32.py _site
          python scripts/harden_cognitive_distinctness_v32.py _site
          python scripts/enrich_lab_content_v32.py _site
          python scripts/render_lab_specificity_v32.py _site
          python scripts/apply_scale_provenance_v32.py _site
          python scripts/audit_all_labs_v22.py _site
          node --check _site/assets/js/lab-v12.js

      - name: Enforce scientific content runtime specificity and provenance reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site/api')
          depth=json.loads((root/'lab-depth-v32.json').read_text(encoding='utf-8'))
          runtime=json.loads((root/'lab-runtime-v32.json').read_text(encoding='utf-8'))
          monitor_items=json.loads((root/'monitor-items-v32.json').read_text(encoding='utf-8'))
          monitor_runtime=json.loads((root/'monitor-runtime-v32.json').read_text(encoding='utf-8'))
          cognitive=json.loads((root/'cognitive-distinctness-v32.json').read_text(encoding='utf-8'))
          specificity=json.loads((root/'lab-specificity-v32.json').read_text(encoding='utf-8'))
          provenance=json.loads((root/'scale-provenance-v32.json').read_text(encoding='utf-8'))
          static=json.loads((root/'all-labs-v22.json').read_text(encoding='utf-8'))
          assert depth['status']=='passed', depth
          assert depth['assessment_pages']==40 and depth['cognitive_pages']==53 and depth['total_tools']==93, depth
          assert depth['minimum_actual_words']>=850, depth
          assert depth['pages_below_depth']==[] and depth['missing_task_profiles']==[] and depth['unexpected_score_types']==[], depth
          assert depth['audit_official_score_disabled'] is True and depth['descriptive_monitoring_only'] is True, depth
          assert depth['who5_arabic_zero_option_repaired'] is True, depth
          assert runtime['status']=='passed', runtime
          assert all(value is True for key,value in runtime.items() if key not in {'version','status','runtime'}), runtime
          assert monitor_items['status']=='passed', monitor_items
          assert monitor_items['monitor_pages']==36 and monitor_items['profiles']==36, monitor_items
          assert monitor_items['total_items']==432 and monitor_items['unique_items']==432, monitor_items
          assert monitor_items['generic_template_items']==0 and monitor_items['written_failures']==[], monitor_items
          assert monitor_runtime['status']=='passed', monitor_runtime
          assert all(value is True for key,value in monitor_runtime.items() if key not in {'version','status','runtime'}), monitor_runtime
          assert cognitive['status']=='passed' and cognitive['missing_pages']==[], cognitive
          assert specificity['status']=='passed', specificity
          assert specificity['monitor_pages']==36 and specificity['cognitive_pages']==53, specificity
          assert specificity['minimum_monitor_specific_words']>=130 and specificity['minimum_cognitive_specific_words']>=95, specificity
          assert specificity['monitor_failures']==[] and specificity['cognitive_failures']==[] and specificity['duplicate_specific_blocks']==0, specificity
          assert provenance['status']=='passed', provenance
          assert provenance['found']==['audit_guided','gad7','phq9','who5'], provenance
          assert provenance['who5_policy']=='adapted_arabic_descriptive_only', provenance
          assert provenance['arabic_exact_text_required_before_validated_claim'] is True, provenance
          assert static['assessment_count']==40 and static['cognitive_count']==53 and static['error_count']==0, static
          print({'depth':depth['minimum_actual_words'],'runtime':'passed','monitor_items':'432/432 unique','cognitive_distinctness':'passed','specificity':'36+53','provenance':'4/4','tools':93})
          PY

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run all-stage completion and Issue 20 acceptance on mobile and desktop
        run: |
          set -euxo pipefail
          python -m http.server 8000 --directory _site >/tmp/issue20-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          AUDIT_BASE_URL=http://127.0.0.1:8000/ AUDIT_SITE_ROOT=_site AUDIT_OUT_DIR=_site/api node scripts/e2e_all_labs_v22.mjs
          AUDIT_BASE_URL=http://127.0.0.1:8000/ AUDIT_SITE_ROOT=_site AUDIT_OUT_DIR=_site/api node scripts/e2e_lab_acceptance_v32.mjs

      - name: Enforce complete browser evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site/api')
          complete=json.loads((root/'all-labs-e2e-v22.json').read_text(encoding='utf-8'))
          acceptance=json.loads((root/'lab-acceptance-v32.json').read_text(encoding='utf-8'))
          assert complete['expectedRuns']==186 and complete['passedRuns']==186 and complete['failedRuns']==0 and complete['errorCount']==0, complete
          assert acceptance['status']=='passed', acceptance
          assert acceptance['assessmentDefinitions']==40 and acceptance['cognitiveDefinitions']==53, acceptance
          assert acceptance['expectedRuns']==186 and acceptance['completedRuns']==186 and acceptance['passedRuns']==186 and acceptance['failedRuns']==0 and acceptance['errorCount']==0, acceptance
          print({'all_stage_runs':'186/186','acceptance_runs':'186/186','profiles':acceptance['profiles']})
          PY

      - name: Upload Issue 20 evidence and review surface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-20-labs-v32-evidence
          path: |
            _site/assessment-lab
            _site/cognitive-lab
            _site/assets/js/lab-v12.js
            _site/api/lab-depth-v32.json
            _site/api/lab-runtime-v32.json
            _site/api/monitor-items-v32.json
            _site/api/monitor-runtime-v32.json
            _site/api/cognitive-distinctness-v32.json
            _site/api/lab-specificity-v32.json
            _site/api/scale-provenance-v32.json
            _site/api/all-labs-v22.json
            _site/api/all-labs-e2e-v22.json
            _site/api/lab-acceptance-v32.json
            /tmp/issue20-http.log
          if-no-files-found: warn
          retention-days: 14